<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <title>Codewars leaderboard</title>
</head>
<body>
  <header>
    <h1>Codewars Leaderboard</h1>
  </header>

  <main>
    <p>Compare Codewars users by their programming scores.</p>
    <form id="users-form">
      <label for="usernames"> Codewares Usernames </label>
      <input 
      type="text" 
      id="usernames" 
      name="usernames" 
      placeholder="Sam, Ali, John" 
      required
      >
      <button type="submit"> Get LeaderBoard </button>
    </form>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
